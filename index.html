<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Hemelkijker</title>
<meta name="description" content="Zie in één overzicht welke vliegtuigen, planeten en sterren nu boven je zijn." />
<link rel="stylesheet" href="style.css" />
</head>
<body>

  <div id="start-screen" class="screen">
    <h1>🔭 Hemelkijker</h1>
    <p>Zie in één overzicht welke vliegtuigen, planeten en sterren nu boven je zijn.
       Geen richten of kantelen nodig — het midden is recht omhoog, de rand is de horizon.</p>
    <button id="start-btn">Start</button>
    <p id="start-status" class="status"></p>
    <p class="hint">Werkt het beste buiten, bij helder weer, 's avonds voor sterren.</p>
  </div>

  <div id="sky-screen" class="screen hidden">
    <canvas id="sky"></canvas>

    <div id="topbar">
      <span id="plane-count">✈️ …</span>
      <span id="time-readout">--:--</span>
      <span id="loc-readout">📍 …</span>
    </div>

    <div id="layer-toggle">
      <button data-layer="planes" class="layer-btn active">✈️</button>
      <button data-layer="planets" class="layer-btn active">🪐</button>
      <button data-layer="stars" class="layer-btn active">⭐</button>
    </div>

    <div id="warning" class="hidden"></div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/astronomy-engine@2/astronomy.browser.js"></script>
  <script src="stars.js"></script>
  <script src="globe.js"></script>
  <script src="app.js"></script>
</body>
</html>
